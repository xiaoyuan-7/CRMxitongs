<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>供应链-电子 · 全部客户清单 · 行业研究报告</title>
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/marked.min.js"></script>
  <style>
    body { background: #0f172a; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; margin: 0; }
    .app-shell { max-width: 1100px; margin: 0 auto; padding: 16px 24px; }
    .topbar-app {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 0 24px; border-bottom: 1px solid #1e293b; margin-bottom: 24px;
    }
    .topbar-app h1 { font-size: 22px; margin: 0; font-weight: 600; color: #f1f5f9; }
    .topbar-app .meta { font-size: 12px; color: #94a3b8; margin-top: 4px; }
    .topbar-app .back { color: #94a3b8; text-decoration: none; font-size: 14px; padding: 6px 12px; border: 1px solid #334155; border-radius: 6px; margin-left: 6px; }
    .topbar-app .back:hover { background: #1e293b; }
    .md-content { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 32px 40px; line-height: 1.7; }
    .md-content h1 { color: #f1f5f9; border-bottom: 2px solid #334155; padding-bottom: 12px; margin-bottom: 20px; font-size: 24px; }
    .md-content h2 { color: #38bdf8; margin-top: 28px; margin-bottom: 12px; font-size: 18px; border-left: 3px solid #38bdf8; padding-left: 12px; }
    .md-content h3 { color: #f1f5f9; margin-top: 20px; margin-bottom: 8px; font-size: 15px; }
    .md-content p { color: #cbd5e1; margin: 10px 0; }
    .md-content ul, .md-content ol { color: #cbd5e1; padding-left: 24px; margin: 8px 0; }
    .md-content li { margin: 4px 0; }
    .md-content blockquote { background: #0f172a; border-left: 4px solid #f59e0b; padding: 12px 16px; margin: 16px 0; color: #94a3b8; border-radius: 4px; }
    .md-content table { width: 100%; border-collapse: collapse; margin: 16px 0; background: #0f172a; border-radius: 6px; overflow: hidden; }
    .md-content th { background: #0f172a; color: #94a3b8; padding: 10px 14px; text-align: left; font-weight: 600; border-bottom: 1px solid #334155; }
    .md-content td { padding: 8px 14px; border-bottom: 1px solid #1e293b; color: #cbd5e1; }
    .md-content tr:hover td { background: #0f172a; }
    .md-content code { background: #0f172a; color: #fbbf24; padding: 2px 6px; border-radius: 3px; font-size: 12px; font-family: 'Courier New', monospace; }
    .md-content strong { color: #f1f5f9; font-weight: 600; }
    .md-content a { color: #38bdf8; text-decoration: none; }
    .md-content a:hover { text-decoration: underline; }
    .md-content hr { border: 0; border-top: 1px solid #334155; margin: 24px 0; }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar-app">
      <div>
        <h1>🔗 供应链-电子 · 全部客户清单</h1>
        <div class="meta">v2 数据(已分类)/ 供应链-电子全部客户</div>
      </div>
      <div>
        <a class="back" href="dashboard.html">🚀 Dashboard</a>
        <a class="back" href="reports.html">📊 报告中心</a>
        <a class="back" href="customers.html">📋 客户清单</a>
      </div>
    </header>

    <article class="md-content" id="content">加载中...</article>
  </div>

  <script>
    fetch('../已分类/05-供应链电子/00-全部客户清单.md')
      .then(r => r.text())
      .then(md => {
        document.getElementById('content').innerHTML = marked.parse(md);
      })
      .catch(e => {
        document.getElementById('content').innerHTML = '<p>加载失败: ' + e + '</p>';
      });
  </script>
</body>
</html>
