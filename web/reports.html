<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>报告中心 · 行业研究报告</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { background: #0f172a; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; margin: 0; }
    .app-shell { max-width: 1480px; margin: 0 auto; padding: 16px 24px; }
    .topbar-app {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 0 24px; border-bottom: 1px solid #1e293b; margin-bottom: 24px;
    }
    .topbar-app h1 { font-size: 22px; margin: 0; font-weight: 600; color: #f1f5f9; }
    .topbar-app .back { color: #94a3b8; text-decoration: none; font-size: 14px; padding: 6px 12px; border: 1px solid #334155; border-radius: 6px; margin-left: 6px; }
    .topbar-app .back:hover { background: #1e293b; }

    /* 统计 */
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
    .stat-card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 14px; text-align: center; }
    .stat-card .v { font-size: 24px; font-weight: 700; color: #38bdf8; line-height: 1; }
    .stat-card .l { font-size: 11px; color: #94a3b8; margin-top: 6px; }

    /* 搜索 + 分类 */
    .toolbar {
      background: #1e293b; border: 1px solid #334155; border-radius: 8px;
      padding: 12px 16px; margin-bottom: 16px; display: flex; gap: 12px; align-items: center;
    }
    .toolbar input[type=text] {
      flex: 1; max-width: 400px; padding: 7px 12px;
      background: #0f172a; border: 1px solid #334155; color: #e2e8f0;
      border-radius: 6px; font-size: 13px;
    }
    .toolbar input[type=text]:focus { outline: 2px solid #38bdf8; }
    .toolbar .v-tab {
      padding: 5px 14px; background: #0f172a; border: 1px solid #334155;
      color: #cbd5e1; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600;
    }
    .toolbar .v-tab.active { background: #38bdf8; color: #0f172a; border-color: #38bdf8; }

    /* 报告卡片 */
    .report-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .report-card {
      background: #1e293b; border: 1px solid #334155; border-radius: 10px;
      padding: 16px 20px; cursor: pointer; transition: all 0.15s; text-decoration: none;
      color: inherit; display: flex; align-items: center; gap: 16px;
    }
    .report-card:hover { border-color: #38bdf8; transform: translateY(-2px); }
    .report-card .icon {
      width: 48px; height: 48px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; flex-shrink: 0;
    }
    .report-card .info { flex: 1; min-width: 0; }
    .report-card .name { font-size: 14px; font-weight: 600; color: #f1f5f9; margin-bottom: 4px; }
    .report-card .desc { font-size: 11px; color: #94a3b8; line-height: 1.5; }
    .report-card .version {
      display: inline-block; padding: 2px 8px; border-radius: 10px;
      font-size: 10px; font-weight: 600; margin-top: 4px;
    }
    .v3 { background: rgba(56, 189, 248, 0.15); color: #38bdf8; }
    .v2 { background: rgba(148, 163, 184, 0.15); color: #94a3b8; }

    .icon-blue { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
    .icon-green { background: rgba(16, 185, 129, 0.15); color: #10b981; }
    .icon-purple { background: rgba(139, 92, 246, 0.15); color: #a78bfa; }
    .icon-orange { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
    .icon-pink { background: rgba(236, 72, 153, 0.15); color: #f472b6; }
    .icon-cyan { background: rgba(14, 165, 233, 0.15); color: #38bdf8; }
    .icon-gray { background: rgba(148, 163, 184, 0.15); color: #94a3b8; }

    .empty-state { text-align: center; padding: 40px 20px; color: #64748b; font-size: 14px; }
  </style>
  <link rel="stylesheet" href="mobile.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar-app">
      <h1>📊 报告中心 · 行业研究报告</h1>
      <div>
        <a class="back" href="dashboard.html">🚀 Dashboard</a>
        <a class="back" href="customers.html">📋 客户清单</a>
        <a class="back" href="anchors.html">🔗 链主</a>
        <a class="back" href="g2b.html">🏛️ G2B</a>
        <a class="back" href="industry-chain.html">🔗 产业链</a>
      </div>
    </header>

    <div class="stats">
      <div class="stat-card"><div class="v" id="v3Count">—</div><div class="l">v3 当前数据报告</div></div>
      <div class="stat-card"><div class="v" id="v2Count">—</div><div class="l">v2 历史数据报告</div></div>
      <div class="stat-card"><div class="v" id="totalCount">—</div><div class="l">报告总数</div></div>
    </div>

    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="🔍 搜索报告标题 / 描述...">
      <div class="v-tab active" data-v="all">全部</div>
      <div class="v-tab" data-v="v3">v3 当前</div>
      <div class="v-tab" data-v="v2">v2 历史</div>
    </div>

    <div class="report-grid" id="reportGrid"></div>

    <div style="margin-top: 16px; padding: 12px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; font-size: 12px; color: #94a3b8;">
      💡 <strong style="color:#cbd5e1;">使用说明</strong>:v3 = 当前最新数据(5971 家) · v2 = 历史数据(老已分类目录,仅供参考)
    </div>
  </div>

  <script src="_reports_index.js"></script>
  <script>
  (function() {
    'use strict';

    const REPORTS = REPORTS_INDEX;
    const ICON_COLORS = ['icon-blue', 'icon-green', 'icon-purple', 'icon-orange', 'icon-pink', 'icon-cyan', 'icon-gray'];

    const v3Count = REPORTS.filter(r => r.version === 'v3').length;
    const v2Count = REPORTS.filter(r => r.version === 'v2').length;
    document.getElementById('v3Count').textContent = v3Count;
    document.getElementById('v2Count').textContent = v2Count;
    document.getElementById('totalCount').textContent = REPORTS.length;

    const state = { v: 'all', q: '' };

    function render() {
      const q = state.q.trim().toLowerCase();
      const filtered = REPORTS.filter(r => {
        if (state.v !== 'all' && r.version !== state.v) return false;
        if (q && !(r.name + r.desc).toLowerCase().includes(q)) return false;
        return true;
      });

      const grid = document.getElementById('reportGrid');
      if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty-state" style="grid-column: 1 / -1;">未找到匹配报告</div>';
        return;
      }
      grid.innerHTML = filtered.map((r, i) => {
        const color = ICON_COLORS[i % ICON_COLORS.length];
        return `
          <a href="${r.file}" class="report-card">
            <div class="icon ${color}">${r.icon}</div>
            <div class="info">
              <div class="name">${r.name}</div>
              <div class="desc">${r.desc}</div>
              <span class="version ${r.version}">${r.version}</span>
            </div>
          </a>
        `;
      }).join('');
    }

    document.getElementById('searchInput').addEventListener('input', e => {
      state.q = e.target.value;
      render();
    });
    document.querySelectorAll('.v-tab').forEach(t => {
      t.onclick = () => {
        document.querySelectorAll('.v-tab').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        state.v = t.dataset.v;
        render();
      };
    });

    render();
  })();
  </script>
</body>
</html>
