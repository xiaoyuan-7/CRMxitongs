<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
  <title>5971 家客户清单 · 多维度筛选</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* 复用 styles 的基础色调 + 自定义筛选区 */
    body {
      background: #0f172a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      margin: 0;
    }
    .app-shell {
      max-width: 1440px;
      margin: 0 auto;
      padding: 16px 24px;
    }
    .topbar-app {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0 24px;
      border-bottom: 1px solid #1e293b;
      margin-bottom: 24px;
    }
    .topbar-app h1 {
      font-size: 22px;
      margin: 0;
      font-weight: 600;
      color: #f1f5f9;
    }
    .topbar-app .back {
      color: #94a3b8;
      text-decoration: none;
      font-size: 14px;
      padding: 6px 12px;
      border: 1px solid #334155;
      border-radius: 6px;
    }
    .topbar-app .back:hover { background: #1e293b; }
    /* 统计条 */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .stat-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 14px;
      text-align: center;
    }
    .stat-card .v {
      font-size: 28px;
      font-weight: 700;
      color: #38bdf8;
      line-height: 1;
    }
    .stat-card .l {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 6px;
    }
    /* 筛选区 */
    .filters {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .filter-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 10px;
    }
    .filter-row label {
      font-size: 12px;
      color: #94a3b8;
      min-width: 56px;
    }
    .filter-row .opts {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      flex: 1;
    }
    .chip {
      background: #0f172a;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 4px 10px;
      border-radius: 14px;
      font-size: 12px;
      cursor: pointer;
      user-select: none;
    }
    .chip:hover { border-color: #38bdf8; }
    .chip.active {
      background: #38bdf8;
      color: #0f172a;
      border-color: #38bdf8;
      font-weight: 600;
    }
    .chip-swatch {
      width: 8px;
      height: 8px;
      display: inline-block;
      border-radius: 50%;
      margin-right: 4px;
      vertical-align: middle;
    }
    .filter-search input {
      width: 280px;
      padding: 7px 12px;
      background: #0f172a;
      border: 1px solid #334155;
      color: #e2e8f0;
      border-radius: 6px;
      font-size: 13px;
    }
    .filter-search input:focus { outline: 2px solid #38bdf8; }
    .filter-toggle {
      background: #0f172a;
      color: #e2e8f0;
      border: 1px solid #334155;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }
    .filter-toggle:hover { background: #1e293b; }
    /* 表格 */
    .table-wrap {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      overflow: hidden;
    }
    table.customers {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    table.customers thead th {
      background: #0f172a;
      color: #94a3b8;
      padding: 10px 12px;
      text-align: left;
      font-weight: 600;
      border-bottom: 1px solid #334155;
      cursor: pointer;
      user-select: none;
      position: sticky;
      top: 0;
      z-index: 5;
    }
    table.customers thead th:hover { background: #1e293b; color: #f1f5f9; }
    table.customers thead th .arr {
      font-size: 10px;
      margin-left: 4px;
      opacity: 0.5;
    }
    table.customers tbody td {
      padding: 9px 12px;
      border-bottom: 1px solid #1e293b;
      color: #cbd5e1;
    }
    table.customers tbody tr:hover { background: #0f172a; }
    .cell-name {
      font-weight: 600;
      color: #f1f5f9;
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
    }
    .cell-name:hover { color: #38bdf8; text-decoration: underline; }

    /* 客户详情抽屉 */
    .drawer-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      z-index: 99; display: none;
    }
    .drawer-backdrop.show { display: block; }
    .drawer {
      position: fixed; top: 0; right: 0; bottom: 0;
      width: 560px; background: #0f172a; border-left: 1px solid #334155;
      z-index: 100; overflow-y: auto;
      transform: translateX(100%); transition: transform 0.25s;
      box-shadow: -4px 0 16px rgba(0,0,0,0.3);
    }
    .drawer.show { transform: translateX(0); }
    .drawer-header {
      padding: 20px 24px; border-bottom: 1px solid #334155;
      position: sticky; top: 0; background: #0f172a; z-index: 5;
      display: flex; align-items: center; justify-content: space-between;
    }
    .drawer-header h2 {
      margin: 0; font-size: 18px; color: #f1f5f9; flex: 1;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .drawer-close {
      background: #334155; border: none; color: #cbd5e1;
      width: 32px; height: 32px; border-radius: 50%;
      cursor: pointer; font-size: 16px; flex-shrink: 0;
    }
    .drawer-close:hover { background: #475569; }
    .drawer-body { padding: 16px 24px; }

    /* 抽屉内部 section */
    .dr-section {
      margin-bottom: 20px; padding-bottom: 20px;
      border-bottom: 1px solid #1e293b;
    }
    .dr-section:last-child { border-bottom: none; }
    .dr-section h3 {
      font-size: 12px; color: #94a3b8; margin: 0 0 10px;
      letter-spacing: 0.5px; font-weight: 600;
      text-transform: uppercase;
    }
    .dr-section .grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    }
    .dr-section .grid > div {
      background: #1e293b; padding: 8px 12px;
      border-radius: 6px; font-size: 12px;
    }
    .dr-section .grid > div .l { color: #94a3b8; font-size: 11px; margin-bottom: 2px; }
    .dr-section .grid > div .v { color: #f1f5f9; font-weight: 600; }
    .dr-section .grid > div .v-strong { color: #fbbf24; font-weight: 600; }

    /* 关系列表 */
    .rel-mini-list { display: flex; flex-direction: column; gap: 4px; }
    .rel-mini {
      background: #1e293b; padding: 6px 10px;
      border-radius: 4px; font-size: 12px;
      display: flex; justify-content: space-between;
    }
    .rel-mini .name { color: #cbd5e1; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 8px; }
    .rel-mini .amt { color: #fbbf24; font-size: 11px; font-weight: 600; }
    .rel-mini .role-badge {
      display: inline-block; padding: 1px 4px; border-radius: 4px;
      font-size: 9px; margin-right: 6px; font-weight: 600;
    }
    .role-sup { background: #0c4a6e; color: #7dd3fc; }
    .role-cus { background: #581c87; color: #d8b4fe; }

    /* 产品推荐 */
    .prod-card {
      background: #1e293b; padding: 10px 12px;
      border-radius: 6px; margin-bottom: 6px;
    }
    .prod-card .prod-name {
      font-size: 13px; font-weight: 600; color: #f1f5f9; margin-bottom: 4px;
      display: flex; align-items: center; gap: 6px;
    }
    .prod-card .score-tag {
      background: #38bdf8; color: #0f172a;
      padding: 1px 8px; border-radius: 10px; font-size: 10px; font-weight: 700;
    }
    .prod-card .prod-detail {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 6px; margin-top: 6px; font-size: 11px;
    }
    .prod-card .prod-detail > div {
      background: #0f172a; padding: 4px 8px; border-radius: 4px;
    }
    .prod-card .prod-detail .l { color: #94a3b8; font-size: 10px; }
    .prod-card .prod-detail .v { color: #cbd5e1; font-weight: 600; }
    .prod-card .reasons {
      font-size: 11px; color: #fbbf24; margin-top: 4px;
    }

    /* 跟进状态(从 localStorage 读) */
    .fu-status {
      display: flex; gap: 12px; align-items: center;
      background: #1e293b; padding: 10px 14px; border-radius: 6px;
    }
    .fu-step {
      width: 26px; height: 26px; border-radius: 50%; background: #334155;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 600; color: #cbd5e1;
    }
    .fu-step.done { background: #10b981; color: #0f172a; }
    .fu-step .lbl { font-size: 10px; color: #94a3b8; margin-left: 4px; }
    .cat-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      color: white;
    }
    .cross-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 2px;
    }
    .cross-tag {
      background: #334155;
      color: #cbd5e1;
      padding: 1px 6px;
      border-radius: 8px;
      font-size: 10px;
    }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .num-strong { color: #f59e0b; font-weight: 600; }
    .num-zero { color: #475569; }
    /* 分页 */
    .pager {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #0f172a;
      border-top: 1px solid #334155;
    }
    .pager .info { color: #94a3b8; font-size: 12px; }
    .pager button {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      margin: 0 2px;
    }
    .pager button:hover:not(:disabled) { background: #334155; }
    .pager button:disabled { opacity: 0.4; cursor: not-allowed; }
    .pager input.page {
      width: 50px;
      text-align: center;
      padding: 4px;
      background: #0f172a;
      border: 1px solid #334155;
      color: #e2e8f0;
      border-radius: 4px;
    }
  </style>

</head>
<body>
  <div class="app-shell">
    <header class="topbar-app">
      <h1>📋 5971 家客户清单 · 多维度筛选</h1>
      <div>
        <a class="back" href="dashboard.html">🚀 Dashboard</a>
        <a class="back" href="g2b.html">🏛️ G2B</a>
        <a class="back" href="anchors.html">🔗 链主</a>

    <!-- 统计 -->
    <div class="stats" id="statsBar"></div>

    <!-- 筛选 -->
    <div class="filters">

        <label>🔍 搜索</label>

      <div class="filter-row">

        <div class="opts">
          <div class="chip active" data-broad="all">全部</div>
          <div class="chip" data-broad="broad">≥ 3 领域(技术综合)</div>

          <div class="chip active" data-rev="all">全部</div>
          <div class="chip" data-rev="0">无营收</div>
          <div class="chip" data-rev="lt10000">&lt; 1 亿</div>
          <div class="chip" data-rev="1-10亿">1-10 亿</div>
          <div class="chip" data-rev="gt100000">&gt; 10 亿</div>
        </div>
        <button class="filter-toggle" id="resetBtn" style="margin-left:auto;">清除筛选</button>
        <button class="filter-toggle" id="exportCsvBtn" style="background:#10b981;color:#0f172a;border-color:#10b981;font-weight:600;">💾 导出 CSV</button>

    </div>

    <!-- 表格 -->
    <div class="table-wrap">
      <table class="customers">
        <thead>
          <tr>
            <th data-sort="idx">#</th>
            <th data-sort="name">企业</th>

            <th data-sort="cap_w" class="num">注册资本</th>
            <th data-sort="legal">法人</th>
            <th data-sort="gb_code">国标行业</th>
            <th data-sort="district">区</th>
            <th class="num" data-sort="relation_count">客户/供应</th>
            <th class="num" data-sort="bid_count">中标</th>
            <th class="num" data-sort="relation_quality">关系分</th>

      <div class="pager">
        <div class="info" id="pagerInfo">—</div>
        <div>
          <button id="prevPageBtn">← 上一页</button>
          <span style="margin: 0 8px;">第 <input class="page" id="pageInput" type="number" min="1" value="1"> / <span id="totalPages">—</span> 页</span>
          <button id="nextPageBtn">下一页 →</button>

  </div>

  <!-- 客户详情抽屉 -->
  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <div class="drawer" id="drawer">
    <div class="drawer-header">
      <h2 id="drName">—</h2>
      <button class="drawer-close" id="drClose">×</button>
    </div>
    <div class="drawer-body" id="drBody">选择企业查看详情</div>
  </div>

  <!-- 数据 -->
  <script src="customers.js?v=20260727-2150"></script>
  <script src="relations.js"></script>
  <script src="quality.js"></script>
  <script src="g2b.js"></script>
  <script src="bank_products.js"></script>

  <script>
  // ========================================================
  // 5971 家客户清单 · 多维度筛选
  // ========================================================

  (function () {
    'use strict';

    const PAGE_SIZE = 50;
    let filtered = CUSTOMERS_DATA;  // 顶层初始化(否则 exportCSV 等用 filtered 会炸)
    const state = {
      selectedTracks: new Set(),
      cross: 'any',           // all / any / yes / no
      broad: 'all',           // all / broad (≥3领域) / deep (=1领域)
      patentN: 'all',         // all / 0 / 1-19 / 20-99 / 100+
      revBucket: 'all',       // all / 0 / lt10000 / 1-10亿 / gt100000
      query: '',
      sortKey: 'patent_score',
      sortDir: 'desc',
      page: 1,
    };

    // 关系数据(从 relations.js 加载)
    const RELATIONS = (typeof CUSTOMER_RELATIONS !== 'undefined') ? CUSTOMER_RELATIONS : {};

    // 关系质量(从 quality.js 加载)
    const QUALITY = {};
    if (typeof RELATION_QUALITY !== 'undefined') {
      RELATION_QUALITY.forEach(q => { QUALITY[q.name] = q; });
    }

    // G2B 中标数据(从 g2b.js 加载)
    const G2B = {};
    if (typeof G2B_DATA !== 'undefined') {
      G2B_DATA.forEach(g => { G2B[g.name] = g; });
    }

    // 银行产品推荐
    const RECOMMENDATIONS = (typeof CUSTOMER_RECOMMENDATIONS !== 'undefined') ? CUSTOMER_RECOMMENDATIONS : {};
    const BANK_PRODUCTS_LIST = (typeof BANK_PRODUCTS !== 'undefined') ? BANK_PRODUCTS : [];

    // ---------- 渲染顶部统计 ----------
    function renderStats() {
      const total = CUSTOMERS_DATA.length;
      const crossCount = CUSTOMERS_DATA.filter(c => c.cross.length > 0).length;
      const patCount = CUSTOMERS_DATA.filter(c => c.patent_n > 0).length;
      const big = CUSTOMERS_DATA.filter(c => c.patent_n >= 100).length;
      const revTotal = CUSTOMERS_DATA.reduce((s, c) => s + (c.rev_w || 0), 0);
      const totalPat = CUSTOMERS_DATA.reduce((s, c) => s + (c.patent_n || 0), 0);
      const dombroad = CUSTOMERS_DATA.filter(c => c.pat_domains_count >= 3).length;

      document.getElementById('statsBar').innerHTML = `
        <div class="stat-card"><div class="v">${total.toLocaleString()}</div><div class="l">企业总数</div></div>
        <div class="stat-card"><div class="v">${Object.keys(RECOMMENDATIONS).length}</div><div class="l">有产品推荐</div></div>
        <div class="stat-card"><div class="v">${crossCount}</div><div class="l">跨赛道</div></div>
        <div class="stat-card"><div class="v">${patCount}</div><div class="l">有专利</div></div>
        <div class="stat-card"><div class="v">${big}</div><div class="l">专利 100+</div></div>
        <div class="stat-card"><div class="v">${dombroad}</div><div class="l">跨领域≥3</div></div>
        <div class="stat-card"><div class="v">${(totalPat/10000).toFixed(1)}万</div><div class="l">总专利</div></div>
      `;
    }

    // ---------- 渲染赛道 chips ----------
    function renderTrackChips() {
      const el = document.getElementById('trackChips');
      el.innerHTML = '';
      const all = document.createElement('div');
      all.className = 'chip';
      all.textContent = '全部';
      all.dataset.track = '__all__';
      all.onclick = () => { state.selectedTracks.clear(); renderTrackChips(); applyFilters(); };
      el.appendChild(all);

      CUSTOMERS_TRACKS.forEach(t => {
        const c = document.createElement('div');
        c.className = 'chip' + (state.selectedTracks.has(t) ? ' active' : '');
        c.dataset.track = t;
        c.innerHTML = `<span class="chip-swatch" style="background:${CUSTOMERS_TRACK_COLORS[t]||'#999'}"></span>${t}`;
        c.onclick = () => {
          if (state.selectedTracks.has(t)) state.selectedTracks.delete(t);
          else state.selectedTracks.add(t);
          renderTrackChips();
          applyFilters();
        };
        el.appendChild(c);
      });
    }

    function bindChipGroup(selector, key, transform) {
      document.querySelectorAll(selector).forEach(el => {
        el.onclick = () => {
          document.querySelectorAll(selector).forEach(e => e.classList.remove('active'));
          el.classList.add('active');
          state[key] = transform ? transform(el.dataset) : el.dataset[Object.keys(el.dataset)[0]];
          // dataset key extraction:
          applyFilters();
        };
      });
    }

    // 简化绑定 — 因为 chip 用了 data-key="value"
    document.addEventListener('click', e => {
      const t = e.target.closest('.chip');
      if (!t) return;
      if (t.dataset.cross !== undefined) {
        document.querySelectorAll('[data-cross]').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        state.cross = t.dataset.cross;
        applyFilters();
      } else if (t.dataset.broad !== undefined) {
        document.querySelectorAll('[data-broad]').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        state.broad = t.dataset.broad;
        applyFilters();
      } else if (t.dataset.pn !== undefined) {
        document.querySelectorAll('[data-pn]').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        state.patentN = t.dataset.pn;
        applyFilters();
      } else if (t.dataset.rev !== undefined) {
        document.querySelectorAll('[data-rev]').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        state.revBucket = t.dataset.rev;
        applyFilters();
      }
    });

    // ---------- 筛选 ----------
    function revFilter(rev) {
      const b = state.revBucket;
      if (b === 'all') return true;
      if (b === '0') return rev === 0;
      if (b === 'lt10000') return rev > 0 && rev < 10000;
      if (b === '1-10亿') return rev >= 10000 && rev < 100000;
      if (b === 'gt100000') return rev >= 100000;
      return true;
    }
    function pnFilter(n) {
      const b = state.patentN;
      if (b === 'all') return true;
      if (b === '0') return n === 0;
      if (b === '1-19') return n >= 1 && n < 20;
      if (b === '20-99') return n >= 20 && n < 100;
      if (b === '100+') return n >= 100;
      return true;
    }
    function broadFilter(c) {
      const b = state.broad;
      if (b === 'all') return true;
      if (b === 'broad') return c.pat_domains_count >= 3;
      if (b === 'deep') return c.pat_domains_count === 1;
      return true;
    }
    function crossFilter(c) {
      const v = state.cross;
      if (v === 'all') return true;
      if (v === 'yes') return c.cross.length > 0;
      if (v === 'no') return c.cross.length === 0;
      // any - don't filter
      return true;
    }
    function trackFilter(c) {
      if (state.selectedTracks.size === 0) return true;
      return state.selectedTracks.has(c.cat);
    }

    function applyFilters() {
      const q = state.query.trim().toLowerCase();
      filtered = CUSTOMERS_DATA.filter(c => {
        if (!trackFilter(c)) return false;
        if (!crossFilter(c)) return false;
        if (!broadFilter(c)) return false;
        if (!pnFilter(c.patent_n)) return false;
        if (!revFilter(c.rev_w)) return false;
        if (q) {
          const hay = (c.name + ' ' + c.legal + ' ' + c.gb_code + ' ' + c.pat_main_domain).toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      // 排序
      const key = state.sortKey;
      const dir = state.sortDir === 'asc' ? 1 : -1;
      if (key === 'relation_count') {
        filtered.sort((a, b) => {
          const ar = RELATIONS[a.name] ? (RELATIONS[a.name].customer_count + RELATIONS[a.name].supplier_count) : 0;
          const br = RELATIONS[b.name] ? (RELATIONS[b.name].customer_count + RELATIONS[b.name].supplier_count) : 0;
          return (ar - br) * dir;
        });
      } else {
        filtered.sort((a, b) => {
          let va = a[key], vb = b[key];
          if (typeof va === 'string' && typeof vb === 'string') {
            return va.localeCompare(vb) * dir;
          }
          return ((va || 0) - (vb || 0)) * dir;
        });
      }

      state.page = 1;
      renderTable();
    }

    // ---------- 渲染表格 ----------
    function fmtNum(n) {
      if (n === 0 || n === null || n === undefined || isNaN(n)) return '<span class="num-zero">—</span>';
      return n.toLocaleString();
    }
    function fmtRev(n) {
      if (!n) return '<span class="num-zero">—</span>';
      if (n >= 10000) return `<span class="num-strong">${(n/10000).toFixed(1)}亿</span>`;
      return n.toLocaleString();
    }
    function fmtCat(cat) {
      const color = CUSTOMERS_TRACK_COLORS[cat] || '#94a3b8';
      return `<span class="cat-badge" style="background:${color}">${cat}</span>`;
    }
    function fmtCross(c) {
      if (c.length === 0) return '<span class="num-zero">—</span>';
      return c.map(x => `<span class="cross-tag">${x}</span>`).join('');
    }

    function renderTable() {
      const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
      const page = Math.min(state.page, totalPages);
      const start = (page - 1) * PAGE_SIZE;
      const slice = filtered.slice(start, start + PAGE_SIZE);

      document.getElementById('totalPages').textContent = totalPages;
      document.getElementById('pageInput').value = page;
      document.getElementById('pageInput').max = totalPages;

      const tbody = document.getElementById('tbody');
      tbody.innerHTML = '';
      slice.forEach((c, i) => {
        const tr = document.createElement('tr');
        // 关系数据
        const rel = RELATIONS[c.name] || { customer_count: 0, supplier_count: 0 };
        const custN = rel.customer_count || 0;
        const supN = rel.supplier_count || 0;
        const totalRel = custN + supN;
        const relBadge = totalRel > 0
          ? `<span style="color:#fbbf24;font-weight:600;">${custN}</span><span style="color:#64748b;">/${totalRel}</span>`
          : '<span class="num-zero">—</span>';
        // G2B 中标
        const g2b = G2B[c.name];
        const bidN = g2b ? g2b.bid_count : 0;
        const bidBadge = bidN > 0
          ? `<span style="color:#fbbf24;font-weight:600;" title="最近 ${g2b.last_bid_year} 年中标">${bidN}</span>`
          : '<span class="num-zero">—</span>';
        // 关系质量分
        const q = QUALITY[c.name];
        const qScore = q ? q.total_quality : 0;
        const qBadge = qScore > 0
          ? (qScore >= 3000 ? `<span style="color:#fbbf24;font-weight:600;">${qScore.toFixed(0)}</span>`
                            : (qScore >= 500 ? `<span style="color:#94a3b8;">${qScore.toFixed(0)}</span>` : qScore.toFixed(0)))
          : '<span class="num-zero">—</span>';
        tr.innerHTML = `
          <td class="num">${start + i + 1}</td>
          <td class="cell-name" title="${c.name}" data-name="${c.name.replace(/"/g, '&quot;')}">${c.name}</td>
          <td>${fmtCat(c.cat)}</td>
          <td><div class="cross-tags">${fmtCross(c.cross)}</div></td>
          <td>${c.pat_main_domain || '<span class="num-zero">—</span>'}</td>
          <td class="num ${c.patent_n >= 100 ? 'num-strong' : ''}">${fmtNum(c.patent_n)}</td>
          <td class="num">${c.patent_first ? c.patent_first : "<span class=.num-zero.>—</span>"} ~ ${c.patent_last ? c.patent_last : "—"}</td>
          <td class="num ${c.patent_score >= 150 ? 'num-strong' : ''}">${c.patent_score ? c.patent_score.toFixed(1) : '—'}</td>
          <td class="num">${fmtRev(c.rev_w)}</td>
          <td class="num">${c.cap_w ? ((c.cap_w >= 10000 ? (c.cap_w/10000).toFixed(1)+'亿' : c.cap_w.toFixed(0)+'万') ) : '<span class="num-zero">—</span>'}</td>
          <td>${c.legal || '<span class="num-zero">—</span>'}</td>
          <td title="${c.gb_code || ''}">${c.gb_code || '<span class="num-zero">—</span>'}</td>
          <td>${c.district || '<span class="num-zero">—</span>'}</td>
          <td class="num" title="客户${custN} / 供应商${supN}">${relBadge}</td>
          <td class="num" title="招投标次数 / 总金额${g2b ? (g2b.total_amt_w/10000).toFixed(1) + '亿' : '—'}">${bidBadge}</td>
          <td class="num" title="高质量关系${q ? q.high_quality_count : 0} 条 / 总金额${q ? (q.amt_sum_w/10000).toFixed(1) + '亿' : '—'}">${qBadge}</td>
          <td title="${RECOMMENDATIONS[c.name] ? RECOMMENDATIONS[c.name][0].name + ' (' + RECOMMENDATIONS[c.name][0].score + '分)' : '无推荐'}">${RECOMMENDATIONS[c.name] ? '<span style="color:#10b981;font-weight:600;font-size:11px;">' + RECOMMENDATIONS[c.name][0].name + '</span>' : '<span class="num-zero">—</span>'}</td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById('pagerInfo').textContent =
        `第 ${start+1}-${Math.min(start+PAGE_SIZE, filtered.length)} 条 / 共 ${filtered.length} 条 (从 ${CUSTOMERS_DATA.length} 全量筛选)`;
    }

    // ============= 客户详情抽屉 =============
    const TRACK_COLORS_DRAWER = CUSTOMERS_TRACK_COLORS;
    const FU_STORAGE_KEY = 'follow_up_data_v1';

    function openDrawer(companyName) {
      const c = CUSTOMERS_DATA.find(x => x.name === companyName);
      if (!c) return;
      document.getElementById('drName').textContent = c.name;
      renderDrawerBody(c);
      document.getElementById('drawer').classList.add('show');
      document.getElementById('drawerBackdrop').classList.add('show');
    }

    function closeDrawer() {
      document.getElementById('drawer').classList.remove('show');
      document.getElementById('drawerBackdrop').classList.remove('show');
    }

    function escapeDr(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function renderDrawerBody(c) {
      const body = document.getElementById('drBody');
      const rel = RELATIONS[c.name] || { customers: [], suppliers: [], customer_count: 0, supplier_count: 0 };
      const g = G2B[c.name];
      const q = QUALITY[c.name];
      const rec = RECOMMENDATIONS[c.name] || [];

      const color = TRACK_COLORS_DRAWER[c.cat] || '#94a3b8';
      const rev = c.rev_w >= 10000 ? (c.rev_w/10000).toFixed(1) + '亿' : (c.rev_w ? c.rev_w.toFixed(0) + '万' : '—');
      const cap = c.cap_w >= 10000 ? (c.cap_w/10000).toFixed(1) + '亿' : (c.cap_w ? c.cap_w.toFixed(0) + '万' : '—');

      let html = '';

      // 基础信息
      html += `
        <div class="dr-section">
          <h3>📋 基础信息</h3>
          <div class="grid">
            <div><div class="l">主营赛道</div><div class="v"><span class="cat-badge" style="background:${color};color:white;font-size:11px;padding:2px 8px;border-radius:8px;">${c.cat}</span></div></div>
            <div><div class="l">法人代表</div><div class="v">${escapeDr(c.legal) || '—'}</div></div>
            <div><div class="l">所在区</div><div class="v">${escapeDr(c.district) || '—'}</div></div>
            <div><div class="l">参保人数</div><div class="v">${c.people || '—'}</div></div>
            <div><div class="l">年营收</div><div class="v">${rev}</div></div>
            <div><div class="l">注册资本</div><div class="v">${cap}</div></div>
            <div><div class="l">国标行业</div><div class="v" style="font-size:11px;">${escapeDr(c.gb_code) || '—'}</div></div>
            <div><div class="l">副赛道</div><div class="v" style="font-size:11px;">${c.cross && c.cross.length > 0 ? c.cross.map(x => `<span style="display:inline-block;background:#334155;color:#cbd5e1;padding:1px 6px;border-radius:6px;font-size:10px;margin-right:2px;">${x}</span>`).join('') : '—'}</div></div>
          </div>
        </div>
      `;

      // 专利画像
      const pat_total = c.patent_n || 0;
      const pat_score = c.patent_score || 0;
      html += `
        <div class="dr-section">
          <h3>🔬 专利画像</h3>
          <div class="grid">
            <div><div class="l">专利总数</div><div class="v ${pat_total >= 100 ? 'v-strong' : ''}">${pat_total}</div></div>
            <div><div class="l">专利评分</div><div class="v ${pat_score >= 150 ? 'v-strong' : ''}">${pat_score ? pat_score.toFixed(1) : '—'}</div></div>
            <div><div class="l">主营专利领域</div><div class="v" style="font-size:11px;">${escapeDr(c.pat_main_domain) || '—'}</div></div>
            <div><div class="l">跨领域广度</div><div class="v">${c.pat_domains_count || 0}</div></div>
            <div><div class="l">专利首/末年</div><div class="v" style="font-size:11px;">${c.patent_first || '—'} ~ ${c.patent_last || '—'}</div></div>
          </div>
        </div>
      `;

      // 关系网络
      html += `
        <div class="dr-section">
          <h3>🔗 关系网络 <span style="font-weight:normal;font-size:11px;color:#94a3b8;text-transform:none;letter-spacing:0;">(${rel.customer_count} 客户 / ${rel.supplier_count} 供应商)</span></h3>
      `;
      if (q) {
        html += `<div style="margin-bottom: 10px; padding: 8px 10px; background: #0f172a; border-radius: 4px; font-size: 12px;">关系质量分: <span class="v-strong" style="font-weight: 600; color: #fbbf24;">${q.total_quality.toFixed(0)}</span> (高质量 ${q.high_quality_count} 条)</div>`;
      }
      // TOP 客户(链主 — 这家企业卖给谁)
      if (rel.customers && rel.customers.length > 0) {
        html += `<div style="font-size:11px;color:#94a3b8;margin-bottom:6px;">↓ 这家企业的客户 (买方 / 链主)</div><div class="rel-mini-list">`;
        rel.customers.slice(0, 8).forEach(r => {
          html += `<div class="rel-mini"><span class="role-badge role-cus">买</span><span class="name" title="${escapeDr(r.name)}">${escapeDr(r.name)}</span><span class="amt">${r.amt_w ? r.amt_w.toFixed(0) + '万' : '—'}</span></div>`;
        });
        html += `</div>`;
      }
      // TOP 供应商
      if (rel.suppliers && rel.suppliers.length > 0) {
        html += `<div style="font-size:11px;color:#94a3b8;margin: 12px 0 6px;">↑ 这家企业的供应商 (卖方)</div><div class="rel-mini-list">`;
        rel.suppliers.slice(0, 8).forEach(r => {
          html += `<div class="rel-mini"><span class="role-badge role-sup">供</span><span class="name" title="${escapeDr(r.name)}">${escapeDr(r.name)}</span><span class="amt">${r.amt_w ? r.amt_w.toFixed(0) + '万' : '—'}</span></div>`;
        });
        html += `</div>`;
      }
      html += `</div>`;

      // G2B 中标
      if (g) {
        html += `
          <div class="dr-section">
            <h3>🏛️ G2B 中标 <span style="font-weight:normal;font-size:11px;color:#94a3b8;text-transform:none;letter-spacing:0;">(投标记录)</span></h3>
            <div class="grid">
              <div><div class="l">中标次数</div><div class="v ${g.bid_count >= 50 ? 'v-strong' : ''}">${g.bid_count}</div></div>
              <div><div class="l">总金额</div><div class="v">${g.total_amt_w >= 10000 ? (g.total_amt_w/10000).toFixed(1) + '亿' : g.total_amt_w.toFixed(0) + '万'}</div></div>
              <div><div class="l">最大单笔</div><div class="v">${g.biggest_bid_w >= 10000 ? (g.biggest_bid_w/10000).toFixed(1) + '亿' : g.biggest_bid_w.toFixed(0) + '万'}</div></div>
              <div><div class="l">招标方数</div><div class="v">${g.buyer_count}</div></div>
              <div><div class="l">最近中标</div><div class="v">${g.last_bid_year || '—'}</div></div>
            </div>
          </div>
        `;
      }

      // 银行产品推荐
      if (rec.length > 0) {
        html += `<div class="dr-section"><h3>💰 银行产品推荐 (TOP 3)</h3>`;
        rec.forEach((p, i) => {
          html += `
            <div class="prod-card">
              <div class="prod-name">
                ${i+1}. ${escapeDr(p.name)}
                <span class="score-tag">${p.score} 分</span>
              </div>
              <div class="prod-detail">
                <div><div class="l">利率</div><div class="v">${escapeDr(p.rate)}</div></div>
                <div><div class="l">额度</div><div class="v">${escapeDr(p.limit)}</div></div>
                <div><div class="l">期限</div><div class="v">${escapeDr(p.term)}</div></div>
              </div>
              ${p.reasons && p.reasons.length > 0 ? `<div class="reasons">💡 ${p.reasons.map(escapeDr).join(' · ')}</div>` : ''}
            </div>
          `;
        });
        html += `</div>`;
      }

      // 跟进状态(从 localStorage 读)
      const fu = getFollowUp(c.name);
      html += `
        <div class="dr-section">
          <h3>📋 跟进状态</h3>
      `;
      if (fu) {
        html += `
          <div class="fu-status">
            <div class="fu-step ${fu.kaihu === '是' ? 'done' : ''}" title="开户">开</div>
            <div class="fu-step ${fu.shouxin === '是' ? 'done' : ''}" title="授信">授</div>
            <div class="fu-step ${fu.daifa === '是' ? 'done' : ''}" title="代发">代</div>
            <div style="flex:1; font-size: 12px; color: #cbd5e1;">
              <div><strong>${escapeDr(fu.tuandui) || '未指定团队'}</strong></div>
              <div style="font-size: 11px; color: #94a3b8;">金额 ${fu.jine || '—'} 万 · ${escapeDr(fu.detail) || '—'}</div>
            </div>
          </div>
        `;
      } else {
        html += `<div style="font-size:12px; color:#94a3b8; padding: 8px 12px; background:#1e293b; border-radius:6px; display:flex; align-items:center; gap:8px;">未在跟进列表<button id="addFollowUpBtn" style="margin-left:auto; padding:5px 12px; background:#10b981; color:#0f172a; border:none; border-radius:6px; cursor:pointer; font-size:12px; font-weight:600;">➕ 加入跟进</button></div>`;
      }
      html += `</div>`;

      body.innerHTML = html;
    }

    function getFollowUp(name) {
      try {
        const d = localStorage.getItem(FU_STORAGE_KEY);
        if (!d) return null;
        const rows = JSON.parse(d);
        return rows.find(r => r.name === name) || null;
      } catch { return null; }
    }

    function getAllFollowUps() {
      try {
        const d = localStorage.getItem(FU_STORAGE_KEY);
        return d ? JSON.parse(d) : [];
      } catch { return []; }
    }
    function saveAllFollowUps(rows) {
      localStorage.setItem(FU_STORAGE_KEY, JSON.stringify(rows));
    }

    // 全局函数:加入跟进(其他页面调用)
    window.addToFollowUp = function(name) {
      const rows = getAllFollowUps();
      if (rows.some(r => r.name === name)) return false;
      rows.push({ name, kaihu: '否', shouxin: '否', jine: '', daifa: '否', tuandui: '', detail: '' });
      saveAllFollowUps(rows);
      return true;
    };

    // 抽屉内部"加入跟进"按钮事件
    document.addEventListener('click', e => {
      if (e.target.id === 'addFollowUpBtn') {
        const cur = getCurrentDrawerCompany();
        if (!cur) return;
        if (window.addToFollowUp(cur.name)) {
          e.target.textContent = '✓ 已加入';
          e.target.style.background = '#475569';
          e.target.disabled = true;
          // 重新渲染抽屉(跟进状态变"刚加入")
          renderDrawerBody(cur);
        }
      }
    });

    function getCurrentDrawerCompany() {
      const name = document.getElementById('drName').textContent;
      if (!name || name === '—') return null;
      return CUSTOMERS_DATA.find(x => x.name === name) || null;
    }

    // 绑定关闭
    document.getElementById('drClose').onclick = closeDrawer;
    document.getElementById('drawerBackdrop').onclick = closeDrawer;
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeDrawer();
    });

    // 绑定表格行点击(企业名)
    document.getElementById('tbody').addEventListener('click', e => {
      const nameEl = e.target.closest('.cell-name');
      if (nameEl) {
        openDrawer(nameEl.dataset.name);
      }
    });

    // 从 URL hash 自动打开
    if (window.location.hash) {
      const name = decodeURIComponent(window.location.hash.slice(1));
      setTimeout(() => openDrawer(name), 100);
    }

    // ---------- 绑定事件 ----------
    document.getElementById('qInput').addEventListener('input', e => {
      state.query = e.target.value;
      applyFilters();
    });
    document.getElementById('resetBtn').onclick = () => {
      state.selectedTracks.clear();
      state.cross = 'all';
      state.broad = 'all';
      state.patentN = 'all';
      state.revBucket = 'all';
      state.query = '';
      state.sortKey = 'patent_score';
      state.sortDir = 'desc';
      document.getElementById('qInput').value = '';
      document.querySelectorAll('.chip').forEach(c => {
        if (['all', '__all__'].includes(c.dataset.cross) || ['all'].includes(c.dataset.broad) ||
            ['all'].includes(c.dataset.pn) || ['all'].includes(c.dataset.rev) ||
            c.dataset.track === '__all__') {
          c.classList.add('active');
        } else {
          c.classList.remove('active');
        }
      });
      document.querySelectorAll('[data-cross="any"]').forEach(c => c.classList.add('active'));
      document.querySelectorAll('[data-cross="all"]').forEach(c => c.classList.remove('active'));
      renderTrackChips();
      applyFilters();
    };

    // ============= CSV 导出 =============
    function exportCSV() {
      const headers = ['企业名称', '主营赛道', '副赛道', '国标行业', '法人', '区', '参保人数',
                      '营收(万)', '注册资本(万)', '专利数', '专利首/末年', '专利主营领域', '客户数', '供应商数', '中标数', '关系总分'];
      const rows = filtered.map(c => {
        const g = G2B[c.name];
        const q = QUALITY[c.name];
        const rel = RELATIONS[c.name] || {};
        const rev = c.rev_w ? c.rev_w.toFixed(0) : '';
        const cap = c.cap_w ? c.cap_w.toFixed(0) : '';
        return [
          c.name, c.cat, (c.cross || []).join('|'), c.gb_code || '',
          c.legal || '', c.district || '', c.people || '',
          rev, cap, c.patent_n || 0, (c.patent_first || '') + '~' + (c.patent_last || ''),
          c.pat_main_domain || '',
          rel.customer_count || 0, rel.supplier_count || 0,
          g ? g.bid_count : '', q ? q.total_quality.toFixed(0) : '',
        ];
      });
      const csv = [headers.join(',')].concat(
        rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(','))
      ).join('\n');
      const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '客户清单_' + filtered.length + '家_' + new Date().toISOString().slice(0,10) + '.csv';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
    document.getElementById('exportCsvBtn').onclick = exportCSV;

    document.querySelectorAll('thead th').forEach(th => {
      th.onclick = () => {
        const key = th.dataset.sort;
        if (state.sortKey === key) state.sortDir = state.sortDir === 'desc' ? 'asc' : 'desc';
        else { state.sortKey = key; state.sortDir = 'desc'; }
        applyFilters();
      };
    });
    document.getElementById('prevPageBtn').onclick = () => {
      if (state.page > 1) { state.page--; renderTable(); }
    };
    document.getElementById('nextPageBtn').onclick = () => {
      const max = Math.ceil(filtered.length / PAGE_SIZE);
      if (state.page < max) { state.page++; renderTable(); }
    };
    document.getElementById('pageInput').onchange = e => {
      const p = parseInt(e.target.value);
      const max = Math.ceil(filtered.length / PAGE_SIZE);
      if (p >= 1 && p <= max) { state.page = p; renderTable(); }
    };

    // ---------- 启动 ----------
    renderStats();
    renderTrackChips();
    document.querySelectorAll('[data-cross="all"]').forEach(c => c.classList.add('active'));
    document.querySelectorAll('[data-cross="any"]').forEach(c => c.classList.remove('active'));
    applyFilters();
  })();
  </script>
</body>
</html>
